name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Setup haxelib
        run: |
          if (!(Test-Path ~/haxelib)) { mkdir ~/haxelib }
          haxelib setup ~/haxelib
        shell: pwsh

      - name: Install hmm
        run: haxelib install hmm --quiet

      - name: Install Haxe libraries via hmm
        run: haxelib run hmm install

      - name: Setup Lime
        run: |
          haxelib run lime setup

      - name: Build Windows
        run: |
          haxelib run lime build windows -release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kareshi-windows-build
          path: export/windows/bin

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Setup haxelib
        run: |
          mkdir ~/haxelib
          haxelib setup ~/haxelib

      - name: Install Linux build tools
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang \
            libc++-dev \
            libc++abi-dev

      - name: Install hmm
        run: haxelib install hmm --quiet

      - name: Install Haxe libraries via hmm
        run: haxelib run hmm install

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r21e and SDK platform 35
        run: |
          sdkmanager "ndk;21.4.7075529"
          echo "y" | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Android paths for Lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_HOME/ndk/21.4.7075529
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Build APK
        run: |
          haxelib run lime build android -debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kareshi-android-debug
          path: export/android/bin
